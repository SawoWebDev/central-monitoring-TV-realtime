# Nginx inside the frontend container: serves the built dashboard and forwards /api to the backend container.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API -> backend container (the same job the Vite proxy does in development).
  # Docker's internal DNS (127.0.0.11) is asked again every 10 s, so a recreated backend container is found.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    # The real browser address, so the backend's rate limit counts each screen separately
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Built files have a content hash in their name, so browsers may cache them for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Dashboard pages (/sales-orders, /settings, ...) are React Router pages: always answer with index.html.
  # no-cache: browsers check for a new version, so an update shows up on the next reload.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
